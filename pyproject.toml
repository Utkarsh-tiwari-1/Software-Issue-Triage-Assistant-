[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "issue-triage-assistant"
version = "1.0.0"
description = "An agentic issue triage API built with FastAPI, LangGraph, LangChain, and ChromaDB."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Issue Triage Assistant contributors" }]
dependencies = [
  "chromadb>=0.5,<2",
  "fastapi>=0.115,<1",
  "langchain>=0.3,<1",
  "langchain-chroma>=0.1,<1",
  "langchain-core>=0.3,<2",
  "langchain-openai>=0.2,<2",
  "langgraph>=0.2,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/issue_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]
